faqEspecificas:
  - id: "cuantos-ejercicios-tiene-dga"
    pregunta: "¿Cuántos ejercicios tiene el proceso selectivo del Gobierno de Aragón?"
    respuesta: |
      Dos ejercicios eliminatorios, ambos tipo test y el mismo día:

      1. **Primer ejercicio (teórico):** 70 preguntas más 5 de reserva, con
         4 opciones de respuesta y una sola válida. Duración: 2 horas. Hay
         que acertar un mínimo de 35 de 70 para superarlo.
      2. **Segundo ejercicio (práctico):** 30 preguntas más 5 de reserva
         sobre uno o varios supuestos prácticos. Duración: 1 hora. Hay que
         acertar un mínimo de 15 de 30 — y solo se corrige a quien ya haya
         superado el primer ejercicio.
    fuente:
      estado: "confirmado"
      fuente: "BOA nº247, 23/12/2025, csv BOA20251223012, Resolución de 19/12/2025 del Director General de la Función Pública"
      fechaConsulta: "2026-09-14"

  - id: "como-se-puntua-dga"
    pregunta: "¿Cómo se puntúan los errores en el examen del Gobierno de Aragón?"
    respuesta: |
      Cada error resta 0,3333 puntos (un tercio de punto). Las preguntas no
      contestadas no penalizan. Este sistema se aplica a los dos
      ejercicios, además de los mínimos de aciertos exigidos en cada uno
      (ver la pregunta sobre la estructura de los ejercicios).
    fuente:
      estado: "confirmado"
      fuente: "BOA nº247, 23/12/2025, csv BOA20251223012, Resolución de 19/12/2025 del Director General de la Función Pública"
      fechaConsulta: "2026-09-14"

  - id: "genera-bolsa-dga"
    pregunta: "¿Esta oposición genera bolsa de trabajo?"
    respuesta: |
      Sí, aunque la convocatoria no usa literalmente la palabra "bolsa": el
      artículo 9 de la convocatoria prevé que se forme una lista de espera
      de personal interino con quienes participen en el proceso sin
      obtener plaza fija, que cumple en la práctica la misma función que
      una bolsa de trabajo.
    fuente:
      estado: "confirmado"
      fuente: "BOA nº247, 23/12/2025, csv BOA20251223012, Resolución de 19/12/2025 del Director General de la Función Pública, artículo 9"
      fechaConsulta: "2026-09-14"

  - id: "que-es-el-curso-de-formacion-selectivo-dga"
    pregunta: "¿Qué es el curso de formación selectivo del Gobierno de Aragón?"
    respuesta: |
      Es una fase adicional del proceso, después de superar los dos
      ejercicios: un curso de formación de 20 horas, impartido online, que
      hay que superar para completar el acceso al cuerpo. No es una fase
      de concurso de méritos (el proceso sigue siendo oposición, no
      concurso-oposición) — es un requisito formativo posterior a la parte
      puramente examinadora.
    fuente:
      estado: "confirmado"
      fuente: "BOA nº247, 23/12/2025, csv BOA20251223012, Resolución de 19/12/2025 del Director General de la Función Pública"
      fechaConsulta: "2026-09-14"
